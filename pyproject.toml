[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "everquill"
dynamic = ["version"]
description = "Everquill coding-agent harness for the official Meta API provider."
readme = "docs/public/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agung Kusumo Widagdo" }]
keywords = [
    "meta",
    "everquill",
    "ai",
    "ai-agent",
    "ai-assistant",
    "personal-ai",
    "personal-assistant",
    "agent",
    "chatbot",
    "chat",
    "llm",
    "cli",
    "terminal",
    "command-line",
    "automation",
    "agent-skill",

]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = []

[dependency-groups]
legacy-development = [
    "curl_cffi>=0.11",
    "noiseprotocol>=0.3",
    "protobuf>=5.0",
]

[project.urls]
Homepage = "https://github.com/akwsa/everquill"
Documentation = "https://github.com/akwsa/everquill#readme"
Repository = "https://github.com/akwsa/everquill"
Issues = "https://github.com/akwsa/everquill/issues"
Changelog = "https://github.com/akwsa/everquill/releases"

[project.scripts]
everquill = "everquill.cli:main"

[tool.hatch.version]
path = "src/everquill_gateway/__init__.py"

[tool.hatch.build]
only-include = [
    ".gitignore",
    "LICENSE",
    "docs/public/BOUNDARY.md",
    "docs/public/README.id.md",
    "docs/public/README.md",
    "docs/public/package-manifest.json",
    "pyproject.toml",
    "src/everquill/__init__.py",
    "src/everquill/cli.py",
    "src/everquill/executor.py",
    "src/everquill/meta_backend.py",
    "src/everquill/node_ui.py",
    "src/everquill/privacy.py",
    "src/everquill/reasoning.py",
    "src/everquill/reply.py",
    "src/everquill/session.py",
    "src/everquill/tui.mjs",
    "src/everquill/worker.py",
    "src/everquill_gateway/__init__.py",
    "src/everquill_gateway/agent/__init__.py",
    "src/everquill_gateway/agent/context.py",
    "src/everquill_gateway/agent/tools.py",
    "src/everquill_gateway/errors.py",
    "src/everquill_gateway/migration.py",
    "tests/test_cli_identity.mjs",
    "tests/test_meta_backend.py",
    "tests/test_meta_public_package.py",
    "tests/test_tui.mjs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/everquill", "src/everquill_gateway"]
only-include = [
    "src/everquill/__init__.py",
    "src/everquill/cli.py",
    "src/everquill/executor.py",
    "src/everquill/meta_backend.py",
    "src/everquill/node_ui.py",
    "src/everquill/privacy.py",
    "src/everquill/reasoning.py",
    "src/everquill/reply.py",
    "src/everquill/session.py",
    "src/everquill/tui.mjs",
    "src/everquill/worker.py",
    "src/everquill_gateway/__init__.py",
    "src/everquill_gateway/agent/__init__.py",
    "src/everquill_gateway/agent/context.py",
    "src/everquill_gateway/agent/tools.py",
    "src/everquill_gateway/errors.py",
    "src/everquill_gateway/migration.py",
]

[tool.hatch.build.targets.wheel.force-include]
"src/everquill/tui.mjs" = "everquill/tui.mjs"

[tool.hatch.build.targets.sdist]
